version: "3"

services:

  neo4j:
    image: neo4j:5
    container_name: neo4j-cds
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/password

  streamlit:
    build: .
    container_name: cds-app
    ports:
      - "8501:8501"
    depends_on:
      - neo4j
